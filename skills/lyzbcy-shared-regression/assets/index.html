<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>捞鱼 · PRD 对照与共享回归</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#23324a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{padding:24px 4vw;background:#142b43;color:white}h1{font-size:24px;margin:0}header p{margin:4px 0;color:#bacde0}main{max-width:1600px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;border:1px solid #ccd6e2;border-radius:6px;padding:8px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#1b68d3;color:white;border:0}input,select{max-width:100%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input{flex:1}#message{color:#9c3822;white-space:pre-wrap}.card{background:white;padding:20px;border:1px solid #dee6ef;border-radius:12px;margin-bottom:16px}h2{font-size:20px;margin:0 0 8px}h3{font-size:16px;margin:0 0 8px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}iframe{width:100%;height:440px;border:1px solid #dde5ee;border-radius:6px;background:#fafbfc}a{color:#1764bb}p{white-space:pre-wrap;margin:8px 0}.point{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e8edf4}.muted{color:#68788c}.badge{font-size:13px;background:#edf2f8;padding:2px 8px;border-radius:12px}.passed{color:#177048}.failed,.conflict{color:#b03232}details{margin-top:8px}dialog{border:0;border-radius:12px;max-width:520px;width:90vw;box-shadow:0 16px 80px #142b4344}dialog::backdrop{background:#142b4366}dialog label{display:block;margin:12px 0}dialog input,dialog select,textarea{display:block;width:100%}textarea{min-height:90px}@media(max-width:850px){.columns{grid-template-columns:1fr}main{padding:12px}iframe{height:350px}}
</style>
<header><h1>PRD 对照与共享回归</h1><p>同一份用例 · 分别执行 · 留下可复核的记录</p></header>
<main><div class="toolbar"><input id="build" aria-label="被测版本" placeholder="填写实际被测版本；未知请注明"><button id="create" class="primary">创建批次</button><select id="runs" aria-label="执行批次"></select><button id="refresh">刷新结果</button></div><p id="message" role="status"></p>
<div class="card"><div class="toolbar"><select id="cases" aria-label="测试用例"></select><span id="counts" class="muted"></span></div><h2 id="title">先创建批次</h2><p id="pre" class="muted"></p><p id="steps"></p></div>
<div class="columns"><section class="card"><h3>真实页面</h3><p><a id="liveLink" target="_blank" rel="noopener">独立打开 ↗</a></p><p class="muted">无法内嵌或需要登录时，请使用独立打开。</p><iframe id="live" title="真实测试页面" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe></section>
<section class="card"><h3>PRD / 设计对照</h3><select id="refs" aria-label="参考资料"></select><p id="refNote" class="muted"></p><p><a id="refLink" target="_blank" rel="noopener">打开原文 ↗</a></p><iframe id="reference" title="PRD或设计参考" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe></section></div>
<section class="card"><h3>对照与辅助演示</h3><div class="toolbar"><label>入口 <select id="entry"></select></label><label>状态 <select id="designState"></select></label><label><input type="checkbox" id="preload" checked> 预载设计图</label><button id="openPrd">打开 PRD 独立窗口</button><button id="locatePrd">定位正文</button></div><p id="capabilityStatus" role="status" class="muted"></p><div class="toolbar"><button id="demoNext">执行下一步</button><button id="demoAuto">自动演示</button><button id="demoStop">停止并恢复</button></div><p id="demoStatus" class="muted"></p></section>
<section class="card"><h3>检查点与接管记录</h3><p class="muted">只记录本次实际观察。未覆盖的检查点保留待验证；自动执行由 CLI 启动。</p><div id="points"></div></section></main>
<dialog id="dialog"><form id="form"><h2>追加复核</h2><label>执行身份<select id="actor"><option value="human">人工</option><option value="ai">AI代理</option></select></label><label>执行者<input id="name" required maxlength="100"></label><label>结论<select id="status"><option value="passed">符合预期</option><option value="failed">不符预期</option><option value="blocked">条件不足 / 阻塞</option></select></label><label>实际观察 / 证据位置<textarea id="note" required maxlength="6000"></textarea></label><div class="toolbar"><button class="primary">追加记录</button><button id="cancel" type="button">取消</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),labels={pending:'待验证',partial:'部分完成',passed:'通过',failed:'失败',blocked:'阻塞',conflict:'存在分歧',stale:'定义已变更'};let run='',selected='',point='',epoch=0;
function option(value,text){const e=document.createElement('option');e.value=value;e.textContent=text;return e}
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function safe(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}}
function target(link,frame,url){url=safe(url);link.hidden=!url;if(url)link.href=url;else link.removeAttribute('href');const next=url||'about:blank';if(frame.src!==next)frame.src=next}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-QA-Client':'1'},body:JSON.stringify(body)}:{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function guard(fn){return async()=>{try{$('message').textContent='';await fn()}catch(e){$('message').textContent=e.message}}}
async function batches(prefer){const rows=await api('/api/runs');$('runs').replaceChildren(...rows.map(r=>option(r.id,r.build+' · '+r.id)));run=rows.some(r=>r.id===prefer)?prefer:rows[0]?.id||'';$('runs').value=run;if(run)await refresh()}
async function refresh(){if(!run)return;const token=++epoch,data=await api('/api/run?id='+encodeURIComponent(run));if(token!==epoch)return;$('counts').textContent=Object.entries(data.counts).filter(([,v])=>v).map(([k,v])=>labels[k]+' '+v).join(' / ');const wanted=selected||location.hash.slice(1);$('cases').replaceChildren(...data.cases.map(c=>option(c.id,c.id+' · '+c.title+' · '+labels[c.status])));selected=data.cases.some(c=>c.id===wanted)?wanted:data.cases[0]?.id||'';$('cases').value=selected;await show()}
async function show(){if(!run||!selected)return;const token=++epoch,data=await api('/api/run?id='+encodeURIComponent(run)+'&case='+encodeURIComponent(selected));if(token!==epoch)return;const c=data.cases[0];if(!c)return;history.replaceState(null,'','#'+c.id);$('title').textContent=c.id+' · '+c.title;$('pre').textContent=c.prerequisite||'';$('steps').textContent=c.steps||'';await comparison.show(c);$('points').replaceChildren(...c.checkpoints.map(p=>{const row=el('div','');row.className='point';const content=el('div',p.title+' ');const badge=el('span',labels[p.status]);badge.className='badge '+p.status;content.append(badge);const details=el('details','');details.append(el('summary','查看记录（'+p.history.length+'）'));p.history.forEach(a=>details.append(el('p',a.created+' · '+a.actor+' / '+a.name+' · '+labels[a.status]+'\n'+a.note)));content.append(details);const button=el('button','追加复核');button.disabled=c.status==='stale';button.onclick=()=>{point=p.id;$('note').value='';$('dialog').showModal()};row.append(content,button);return row}))}
$('create').onclick=guard(async()=>{const d=await api('/api/create',{build:$('build').value});selected='';await batches(d.id)});$('runs').onchange=guard(async()=>{run=$('runs').value;await refresh()});$('cases').onchange=guard(async()=>{selected=$('cases').value;await show()});$('refresh').onclick=guard(refresh);$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('/api/record',{run,case:selected,point,actor:$('actor').value,name:$('name').value,status:$('status').value,note:$('note').value});$('dialog').close();await refresh()}catch(err){$('message').textContent=err.message}finally{b.disabled=false}};
</script><script src="/comparison.js"></script><script>guard(()=>batches())();</script></html>
